anaconda_config_version: 1
upstream_sources:
  - webpage:
      url: https://api.anaconda.org/package/conda-forge/libcufile
      regex: '"version":\s*"([^"]+)"'
    packages:
      - gds-tools
      - libcufile
      - libcufile-dev
      - libcufile-static
  - webpage:
      url: https://api.anaconda.org/package/conda-forge/libcufile
      regex: '"version":\s*"(13\.2(?:\.\d+)*)"'
    feedstock_branch: '13.2'
    version_matchspec: '>=13.2,<13.3'
    supported: true
    packages:
      - gds-tools
      - libcufile
      - libcufile-dev
      - libcufile-static
